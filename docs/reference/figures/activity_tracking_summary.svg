<svg xmlns="http://www.w3.org/2000/svg" id="tt-fig-summary" viewBox="0 0 760 470" role="img" aria-label="A Calendar activity column from 09:00 to 13:00 with four blocks, and the summary of the hovered 09:52 to 11:05 block: its workspaces MyApp, 2026_Noise, and Social with their shares and items, two background items, and a footer.">
<style>
#tt-fig-summary { width: 100%; height: auto; display: block; margin: 0 auto; max-width: 760px; }
#tt-fig-summary text { font-family: var(--font-stack, -apple-system, sans-serif); font-size: 12px; fill: var(--tt-fg, #1c2529); }
#tt-fig-summary .note { fill: var(--tt-muted, #5c6b72); }
#tt-fig-summary .rel { fill: var(--tt-fg, #1c2529); }
#tt-fig-summary .zlabel { font-weight: 600; fill: var(--tt-muted, #5c6b72); }
#tt-fig-summary .lname { font-size: 14px; font-weight: 600; }
#tt-fig-summary .cname { font-size: 14px; font-weight: 600; }
#tt-fig-summary .cname.sm { font-size: 12px; }
#tt-fig-summary .sname { font-family: var(--font-stack--monospace, ui-monospace, monospace); font-size: 13px; font-weight: 600; }
#tt-fig-summary .mono { font-family: var(--font-stack--monospace, ui-monospace, monospace); }
#tt-fig-summary .link { fill: var(--tt-accent, #0b6e75); text-decoration: underline; }
#tt-fig-summary .wake { fill: var(--tt-accent, #0b6e75); }
#tt-fig-summary .ptext { font-size: 13px; font-weight: 600; fill: var(--tt-warn, #a4560a); }
#tt-fig-summary .ptext.planned { fill: var(--tt-muted, #5c6b72); font-weight: 500; }
#tt-fig-summary .pill { fill: var(--tt-warn-soft, #fbeedd); stroke: var(--tt-warn, #a4560a); stroke-width: 1.3; }
#tt-fig-summary .pill.planned { fill: none; stroke: var(--tt-muted, #5c6b72); stroke-dasharray: 4 3; }
#tt-fig-summary .box { fill: var(--tt-panel, #ffffff); stroke: var(--tt-line, #b6c2c8); stroke-width: 1.2; }
#tt-fig-summary .box.dev { stroke: var(--tt-fg, #1c2529); stroke-width: 1.4; }
#tt-fig-summary .store { fill: var(--tt-local, #eeeff3); stroke: var(--tt-line, #b6c2c8); stroke-width: 1.2; }
#tt-fig-summary .frame { fill: none; stroke: var(--tt-line, #b6c2c8); stroke-width: 1.2; stroke-dasharray: 6 4; }
#tt-fig-summary .rule { stroke: var(--tt-line, #b6c2c8); }
#tt-fig-summary .lead { fill: none; stroke: var(--tt-fg, #1c2529); stroke-width: 1.1; }
#tt-fig-summary path.wl, #tt-fig-summary line.wl { fill: none; stroke: var(--tt-accent, #0b6e75); stroke-width: 1.2; stroke-dasharray: 5 4; }
#tt-fig-summary .loop { fill: none; stroke: var(--tt-warn, #a4560a); stroke-width: 2; }
#tt-fig-summary .ahead { fill: var(--tt-fg, #1c2529); }
#tt-fig-summary .lhead { fill: var(--tt-warn, #a4560a); }
#tt-fig-summary .whead { fill: var(--tt-accent, #0b6e75); }
#tt-fig-summary .soft { fill: var(--tt-accent-soft, #e0eff0); stroke: var(--tt-accent, #0b6e75); stroke-width: 1; }
#tt-fig-summary .hot { fill: var(--tt-accent, #0b6e75); }
#tt-fig-summary .hot-text { fill: var(--tt-panel, #ffffff); }
#tt-fig-summary .bgblock { fill: none; stroke: var(--tt-accent, #0b6e75); stroke-width: 1; stroke-dasharray: 4 3; }
#tt-fig-summary .bar-bg { fill: var(--tt-rule, #dde3e6); }
#tt-fig-summary .bar { fill: var(--tt-accent, #0b6e75); }
#tt-fig-summary .pop { fill: var(--tt-panel, #ffffff); stroke: var(--tt-line, #b6c2c8); stroke-width: 1; }
#tt-fig-summary .devtext { font-weight: 600; fill: var(--tt-warn, #a4560a); }
#tt-fig-summary .b { font-weight: 600; }
#tt-fig-summary .head { font-size: 15px; font-weight: 600; }
#tt-fig-summary .small { font-size: 11px; }
</style>
