<svg xmlns="http://www.w3.org/2000/svg" id="tt-fig-loops" viewBox="0 0 760 1160" role="img" aria-label="The agent on the Mac runs a local activity loop, a remote activity loop, a request handler, and a rebuild loop around samples.sqlite. The iPhone and iPad upload DeviceEvents to CloudKit, and Safari syncs their visits into History.db. The rebuild loop writes the block log and current.json.">
<style>
#tt-fig-loops { width: 100%; height: auto; display: block; margin: 0 auto; max-width: 760px; }
#tt-fig-loops text { font-family: var(--font-stack, -apple-system, sans-serif); font-size: 12px; fill: var(--tt-fg, #1c2529); }
#tt-fig-loops .note { fill: var(--tt-muted, #5c6b72); }
#tt-fig-loops .rel { fill: var(--tt-fg, #1c2529); }
