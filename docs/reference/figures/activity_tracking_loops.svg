#tt-fig-loops .lname { font-size: 14px; font-weight: 600; }
#tt-fig-loops .cname { font-size: 14px; font-weight: 600; }
#tt-fig-loops .cname.sm { font-size: 12px; }
#tt-fig-loops .sname { font-family: var(--font-stack--monospace, ui-monospace, monospace); font-size: 13px; font-weight: 600; }
