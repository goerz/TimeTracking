#tt-fig-loops path.wl, #tt-fig-loops line.wl { fill: none; stroke: var(--tt-accent, #0b6e75); stroke-width: 1.2; stroke-dasharray: 5 4; }
#tt-fig-loops .loop { fill: none; stroke: var(--tt-warn, #a4560a); stroke-width: 2; }
#tt-fig-loops .ahead { fill: var(--tt-fg, #1c2529); }
#tt-fig-loops .lhead { fill: var(--tt-warn, #a4560a); }
#tt-fig-loops .whead { fill: var(--tt-accent, #0b6e75); }
#tt-fig-loops .soft { fill: var(--tt-accent-soft, #e0eff0); stroke: var(--tt-accent, #0b6e75); stroke-width: 1; }
#tt-fig-loops .hot { fill: var(--tt-accent, #0b6e75); }
#tt-fig-loops .hot-text { fill: var(--tt-panel, #ffffff); }
#tt-fig-loops .bgblock { fill: none; stroke: var(--tt-accent, #0b6e75); stroke-width: 1; stroke-dasharray: 4 3; }
#tt-fig-loops .bar-bg { fill: var(--tt-rule, #dde3e6); }
#tt-fig-loops .bar { fill: var(--tt-accent, #0b6e75); }
#tt-fig-loops .pop { fill: var(--tt-panel, #ffffff); stroke: var(--tt-line, #b6c2c8); stroke-width: 1; }
#tt-fig-loops .devtext { font-weight: 600; fill: var(--tt-warn, #a4560a); }
#tt-fig-loops .b { font-weight: 600; }
#tt-fig-loops .head { font-size: 15px; font-weight: 600; }
#tt-fig-loops .small { font-size: 11px; }
</style>
