#tt-fig-loops .link { fill: var(--tt-accent, #0b6e75); text-decoration: underline; }
#tt-fig-loops .wake { fill: var(--tt-accent, #0b6e75); }
#tt-fig-loops .ptext { font-size: 13px; font-weight: 600; fill: var(--tt-warn, #a4560a); }
#tt-fig-loops .ptext.planned { fill: var(--tt-muted, #5c6b72); font-weight: 500; }
#tt-fig-loops .pill { fill: var(--tt-warn-soft, #fbeedd); stroke: var(--tt-warn, #a4560a); stroke-width: 1.3; }
#tt-fig-loops .pill.planned { fill: none; stroke: var(--tt-muted, #5c6b72); stroke-dasharray: 4 3; }
#tt-fig-loops .box { fill: var(--tt-panel, #ffffff); stroke: var(--tt-line, #b6c2c8); stroke-width: 1.2; }
#tt-fig-loops .box.dev { stroke: var(--tt-fg, #1c2529); stroke-width: 1.4; }
#tt-fig-loops .store { fill: var(--tt-local, #eeeff3); stroke: var(--tt-line, #b6c2c8); stroke-width: 1.2; }
#tt-fig-loops .frame { fill: none; stroke: var(--tt-line, #b6c2c8); stroke-width: 1.2; stroke-dasharray: 6 4; }
#tt-fig-loops .rule { stroke: var(--tt-line, #b6c2c8); }
