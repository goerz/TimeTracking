<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mockup-size" content="660,376">
<title>Settings, Shortcuts pane</title>
<link rel="stylesheet" href="mockup.css">
<style>

.settings { background: #fff; }
.stitle { height: 30px; display: flex; align-items: center; justify-content: center; position: relative; font-size: 13px; font-weight: 600; }
.stitle .traffic { position: absolute; left: 14px; top: 10px; }
.panes { display: flex; justify-content: center; gap: 2px; padding: 6px 0 8px; border-bottom: 0.5px solid var(--separator-strong); background: #F7F7F9; }
.stitle-wrap { background: #F7F7F9; }
.pane { width: 76px; height: 50px; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: var(--label-2); }
.pane svg.i { width: 22px; height: 22px; color: var(--label-2); }
.pane.on { background: rgba(0,0,0,0.07); color: var(--accent); }
.pane.on svg.i { color: var(--accent); }
.sform { padding: 26px 30px 24px; }
.srow { display: flex; align-items: center; gap: 10px; height: 34px; }
.srow .lbl { width: 200px; text-align: right; }
.recorder { width: 170px; height: 24px; border-radius: 6px; background: #fff; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.22), inset 0 0.5px 1px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; position: relative; font-size: 13px; }
.recorder .x { position: absolute; right: 5px; top: 4px; color: var(--label-3); }
.recorder .k { letter-spacing: 0.08em; }
.srow.cb { height: 26px; }
.srow.cb .lbl { visibility: hidden; }
.srow.cb .opt { display: flex; align-items: center; gap: 7px; }

</style>
</head>
<body>
<div class="desk">
<div class="window settings" style="left:30px;top:30px;width:600px;height:316px">
  <div class="stitle-wrap"><div class="stitle"><div class="traffic"><span></span><span></span><span></span></div>Shortcuts</div></div>
  <div class="panes"><div class="pane"><svg class="i "><use href="#gearshape"/></svg><span>General</span></div><div class="pane"><svg class="i "><use href="#timer"/></svg><span>Pomodoro</span></div><div class="pane"><svg class="i "><use href="#moon"/></svg><span>Idle</span></div><div class="pane"><svg class="i "><use href="#bell"/></svg><span>Reminders</span></div><div class="pane on"><svg class="i "><use href="#keyboard"/></svg><span>Shortcuts</span></div><div class="pane"><svg class="i "><use href="#waveform"/></svg><span>Tracker</span></div></div>
  <div class="sform">
    <div class="srow"><div class="lbl">Show/hide Timer window:</div><div class="recorder"><span class="k">⌥⌘R</span><span class="x"><svg class="i s14"><use href="#xmark-circle-fill"/></svg></span></div></div>
    <div class="srow"><div class="lbl">Continue/stop timer:</div><div class="recorder"><span class="ter">Record Shortcut</span></div></div>
    <div style="height:12px"></div>
    <div class="srow cb"><div class="lbl">x</div><div class="opt"><span class="check"></span>Focus app when the timer starts</div></div>
    <div class="srow cb"><div class="lbl">x</div><div class="opt"><span class="check"></span>Focus app when the timer stops</div></div>
  </div>
</div></div>
<script src="icons.js"></script>
</body>
</html>
