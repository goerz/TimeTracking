<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mockup-size" content="500,148">
<title>Timer window, compact</title>
<link rel="stylesheet" href="mockup.css">
<style>

.timerwin { background: #fff; }
.bar { height: 88px; background: #F7F7F9; border-bottom: 0.5px solid var(--separator-strong); padding: 0 14px 0 16px; }
.bar-row { height: 46px; display: flex; align-items: center; gap: 10px; padding-top: 6px; }
.bar-row.r2 { height: 36px; padding-top: 0; padding-bottom: 6px; padding-left: 68px; gap: 8px; }
.bar .traffic { width: 52px; margin-right: 6px; }
.taskfield { flex: 1 1 auto; min-width: 0; height: 30px; display: flex; align-items: center; padding: 0 9px; border-radius: 8px; background: #fff; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.14); font-size: 15px; white-space: nowrap; overflow: hidden; }
.taskfield.focus { box-shadow: 0 0 0 3.5px rgba(10,122,255,0.30), inset 0 0 0 0.5px rgba(10,122,255,0.8); }
.timer { font-size: 17px; font-weight: 500; min-width: 64px; text-align: right; letter-spacing: 0.2px; }
.startstop { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex: none; }
.startstop.stop { background: var(--red); }
.startstop.start { background: var(--accent); }
.discard { color: var(--label-3); display: inline-flex; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 9px; border-radius: 13px; background: var(--fill-2); font-size: 12.5px; white-space: nowrap; }
.chip.active { background: var(--accent-tint); box-shadow: inset 0 0 0 1px rgba(10,122,255,0.35); }
.chip .chev, .pomo .chev { color: var(--label-2); margin-left: 1px; }
.pomo { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--fill-2); font-size: 12.5px; color: var(--label); white-space: nowrap; }
.pomo svg.i { color: var(--label-2); }
.pin { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 13px; color: var(--label-2); }
.bar{border-bottom:none}
</style>
</head>
<body>
<div class="desk">
<div class="window timerwin" style="left:30px;top:30px;width:440px;height:88px">

<div class="bar">
  <div class="bar-row">
    <div class="traffic"><span></span><span></span><span></span></div>
    <div class="taskfield">Clarify noise model</div>
    <div class="timer tnum">0:42:27</div>
    <span class="ctl stop halo" style="--d:28px"></span>
    <span class="discard"><svg class="i s18"><use href="#xmark-circle"/></svg></span>
  </div>
  <div class="bar-row r2">
    <div class="chip"><span class="dot" style="background:#12A594;width:10px;height:10px"></span><span class="ell">Noise Model<span class="sec"> · University</span></span><svg class="i s12 chev"><use href="#chevron-down"/></svg></div>
    <div class="pomo"><svg class="i s14"><use href="#timer"/></svg><span>Pomodoro</span><svg class="i s12 chev"><use href="#chevron-down"/></svg></div>
    <div class="grow"></div>
    <div class="pin"><svg class="i s14"><use href="#pin"/></svg></div>
  </div>
</div>
</div></div>
<script src="icons.js"></script>
</body>
</html>
