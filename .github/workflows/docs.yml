# Builds the documentation site and deploys it to GitHub Pages
# (architecture.md §2.7). Screenshots are committed, so this needs no Mac.
name: Documentation

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: docs/uv.lock
      - uses: actions/configure-pages@v6
      - name: Build the site
        run: uv run --project docs --locked sphinx-build -W --keep-going -q -b html docs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
